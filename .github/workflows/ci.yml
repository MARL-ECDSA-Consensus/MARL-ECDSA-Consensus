name: CI - Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每日定时质检：即使无新提交也自动跑全量测试（24h 无人值守持续优化）
    - cron: '15 2 * * *'   # 每日 UTC 02:15（北京时间 10:15）

permissions:
  contents: write

jobs:
  test:
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Verify dashboard imports (Flask route registration)
        run: |
          python -c "from visualization.dashboard import _create_app; app = _create_app(); assert app is not None; print('dashboard OK, routes:', len(app.url_map._rules))"

      - name: Verify consensus factory (all modes)
        run: |
          python -c "
          from blockchain.consensus.factory import create_consensus_engine
          for mode in ['cw_pbft', 'standard_pbft', 'fast']:
              eng = create_consensus_engine('node_0', ['node_0','node_1','node_2'], mode=mode)
              assert eng is not None
          print('consensus factory OK')
          "

  review-log:
    name: Append review log (audit trail)
    runs-on: ubuntu-latest
    needs: test
    # P1-16修复: 与心跳工作流共用 repo-write 串行组，杜绝并行 push 冲突
    concurrency:
      group: repo-write
      cancel-in-progress: false
    # PR 不写日志（避免给他人 fork 仓库 push）；push/schedule/manual 均记录
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "TrueFurina"
          git config user.email "2468001320@qq.com"

      - name: Append review log entry
        run: |
          mkdir -p activity
          FILE="activity/review-log.md"
          [ -f "$FILE" ] || printf '# MARL-ECDSA Continuous Review Log\n\n| Time (UTC) | Event | Status |\n|---|---|---|\n' > "$FILE"
          printf '| %s | %s | tests passed |\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ github.event_name }}" >> "$FILE"
          git add "$FILE"
          git commit -m "chore: append review log - $(date -u +%Y-%m-%dT%H:%M:%SZ)" --allow-empty
          # P1-17修复: 先同步远端，再 force-with-lease 推送（保留本步提交，杜绝并发非快进）
          git fetch origin main
          git rebase origin/main || git merge origin/main || true
          for attempt in 1 2 3 4 5; do
            if git push --force-with-lease origin main 2>&1 | tee /tmp/push.log; then
              echo "review log pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt failed: $(tail -2 /tmp/push.log)"
            git fetch origin main
            git rebase origin/main || git merge origin/main || true
            sleep 8
          done
          echo "all push attempts failed" >&2
          exit 1
