[pytest]
minversion = 7.0
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    crypto: cryptography-related tests (ECDSA key generation, sign/verify, serialization)
    blockchain: blockchain structure tests (Transaction, Block, Blockchain)
    security: security guard tests (timestamp, nonce, k-value reuse detection)
    asyncio: asyncio-based tests (requires pytest-asyncio)
    timeout: tests with per-test timeout (requires pytest-timeout)
